<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <meta name="description" content="Suivi mobile des achats, budgets et CA des rayons." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Suivi Achats — Isigny</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CARREFOUR MARKET · ISIGNY-SUR-MER</p>
        <h1>Suivi achats</h1>
      </div>
      <div class="topbar-actions">
        <span id="syncBadge" class="status-pill status-neutral">Local</span>
        <button id="profileBtn" class="icon-btn" aria-label="Profil">👤</button>
      </div>
    </header>

    <main id="main" class="main-content" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Navigation principale">
      <button data-route="dashboard" class="nav-item active"><span>⌂</span><small>Accueil</small></button>
      <button data-route="entry" class="nav-item"><span>＋</span><small>Saisie</small></button>
      <button data-route="history" class="nav-item"><span>↺</span><small>Historique</small></button>
      <button data-route="recommendations" class="nav-item"><span>✦</span><small>Préco.</small></button>
      <button data-route="settings" class="nav-item admin-only"><span>⚙</span><small>Réglages</small></button>
    </nav>
  </div>

  <dialog id="toastDialog" class="toast-dialog"><p id="toastText"></p></dialog>

  <script src="./runtime-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
